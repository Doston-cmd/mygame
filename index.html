<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solo Leveling: System</title>
    <!-- Подключаем скрипт Telegram, чтобы окно работало правильно -->
    <script src="https://telegram.org"></script>
    <style>
        body {
            background-color: #0d1117;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        .card {
            border: 2px solid #8a2be2;
            border-radius: 15px;
            background: linear-gradient(145deg, #1f1a3a, #0d0b18);
            padding: 20px;
            box-shadow: 0 0 20px rgba(138, 43, 226, 0.5);
            max-width: 350px;
            margin: 0 auto;
        }
        h1 {
            color: #00ffff;
            text-shadow: 0 0 10px #00ffff;
            margin-bottom: 5px;
        }
        .title {
            color: #8a2be2;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .stat-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #332a56;
        }
        .stat-val {
            color: #ff007f;
            font-weight: bold;
        }
        .btn {
            background-color: #00ffff;
            color: #000;
            border: none;
            padding: 12px 25px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 20px;
            width: 100%;
            box-shadow: 0 0 10px #00ffff;
        }
        .btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Sung Jinwoo</h1>
        <div class="title">The Monarch of Shadows</div>
        
        <div class="stat-row">
            <span>Уровень (Lv.)</span>
            <span class="stat-val" id="lvl">75</span>
        </div>
        <div class="stat-row">
            <span>Сила (Strength)</span>
            <span class="stat-val" id="str">19</span>
        </div>
        <div class="stat-row">
            <span>Ловкость (Agility)</span>
            <span class="stat-val" id="agi">10</span>
        </div>
        <div class="stat-row">
            <span>Живучесть (Vitality)</span>
            <span class="stat-val" id="vit">10</span>
        </div>

        <button class="btn" onclick="levelUp()">ПОВЫСИТЬ УРОВЕНЬ</button>
    </div>

    <script>
        // Инициализация Telegram WebApp
        const tg = window.Telegram.WebApp;
        tg.expand(); // Развернуть окно на весь экран

        // Простая функция для кнопки
        function levelUp() {
            let lvlElement = document.getElementById('lvl');
            let currentLvl = parseInt(lvlElement.innerText);
            lvlElement.innerText = currentLvl + 1;
            
            let strElement = document.getElementById('str');
            strElement.innerText = parseInt(strElement.innerText) + 2;
            
            // Всплывающее уведомление внутри Telegram
            tg.showAlert("⚡ Уровень повышен! Сила выросла!");
        }
    </script>
</body>
</html>
