<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solo Leveling: System</title>
    <script src="https://telegram.org"></script>
    <style>
        body {
            background-color: #0d1117;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        .card {
            border: 2px solid #8a2be2;
            border-radius: 15px;
            background: linear-gradient(145deg, #1f1a3a, #0d0b18);
            padding: 20px;
            box-shadow: 0 0 20px rgba(138, 43, 226, 0.5);
            max-width: 350px;
            margin: 0 auto;
        }
        h1 {
            color: #00ffff;
            text-shadow: 0 0 10px #00ffff;
            margin-bottom: 5px;
        }
        .title {
            color: #8a2be2;
            font-weight: bold;
            margin-bottom: 20px;
        }
        
        /* Стили для статус-баров HP и MP */
        .bar-container {
            margin: 15px 0;
            text-align: left;
        }
        .bar-label {
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 4px;
            display: flex;
            justify-content: space-between;
        }
        .bar-bg {
            background-color: #222;
            border-radius: 8px;
            overflow: hidden;
            height: 14px;
            border: 1px solid #444;
        }
        .hp-fill {
            background: linear-gradient(90deg, #ff0044, #ff5577);
            height: 100%;
            width: 100%;
            box-shadow: 0 0 8px #ff0044;
            transition: width 0.3s;
        }
        .mp-fill {
            background: linear-gradient(90deg, #0099ff, #00d2ff);
            height: 100%;
            width: 100%;
            box-shadow: 0 0 8px #0099ff;
            transition: width 0.3s;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #332a56;
        }
        .stat-val {
            color: #ff007f;
            font-weight: bold;
        }
        .btn {
            background-color: #00ffff;
            color: #000;
            border: none;
            padding: 12px 25px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 20px;
            width: 100%;
            box-shadow: 0 0 10px #00ffff;
        }
        .btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Sung Jinwoo</h1>
        <div class="title">The Monarch of Shadows</div>
        
        <!-- Полоска HP -->
        <div class="bar-container">
            <div class="bar-label"><span>HP</span><span id="hp-text">100 / 100</span></div>
            <div class="bar-bg"><div class="hp-fill" id="hp-bar"></div></div>
        </div>

        <!-- Полоска MP -->
        <div class="bar-container">
            <div class="bar-label"><span>MP</span><span id="mp-text">100 / 100</span></div>
            <div class="bar-bg"><div class="mp-fill" id="mp-bar"></div></div>
        </div>
        
        <div class="stat-row">
            <span>Уровень (Lv.)</span>
            <span class="stat-val" id="lvl">75</span>
        </div>
        <div class="stat-row">
            <span>Сила (Strength)</span>
            <span class="stat-val" id="str">19</span>
        </div>
        <div class="stat-row">
            <span>Ловкость (Agility)</span>
            <span class="stat-val" id="agi">10</span>
        </div>
        <div class="stat-row">
            <span>Живучесть (Vitality)</span>
            <span class="stat-val" id="vit">10</span>
        </div>

        <button class="btn" onclick="levelUp()">ПОВЫСИТЬ УРОВЕНЬ</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // Загрузка сохраненных данных
        window.onload = function() {
            if (localStorage.getItem('lvl')) {
                document.getElementById('lvl').innerText = localStorage.getItem('lvl');
                document.getElementById('str').innerText = localStorage.getItem('str');
                updateBars(parseInt(localStorage.getItem('lvl')));
            }
        }

        function updateBars(lvl) {
            let maxHp = 100 + (lvl - 75) * 15;
            let maxMp = 100 + (lvl - 75) * 10;
            document.getElementById('hp-text').innerText = maxHp + " / " + maxHp;
            document.getElementById('mp-text').innerText = maxMp + " / " + maxMp;
        }

        function levelUp() {
            let lvlElement = document.getElementById('lvl');
            let strElement = document.getElementById('str');
            
            let newLvl = parseInt(lvlElement.innerText) + 1;
            let newStr = parseInt(strElement.innerText) + 2;
            
            lvlElement.innerText = newLvl;
            strElement.innerText = newStr;
            
            // Сохраняем в память телефона
            localStorage.setItem('lvl', newLvl);
            localStorage.setItem('str', newStr);
            
            // Обновляем шкалы
            updateBars(newLvl);
            
            tg.showAlert("⚡ Система зафиксировала поднятие уровня! Характеристики увеличены.");
        }
    </script>
</body>
</html>
